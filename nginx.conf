server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or server IP

    # Logging
    access_log /var/log/nginx/mou-dashboard.access.log;
    error_log /var/log/nginx/mou-dashboard.error.log;

    # Max upload size (for CSV uploads)
    client_max_body_size 10M;

    location / {
        proxy_pass http://unix:/var/www/mou-dashboard/mou-dashboard.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Static files (if you add any later)
    location /static {
        alias /var/www/mou-dashboard/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
